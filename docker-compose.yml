services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
      POSTGRES_DB: voice
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://voice:voice@db:5432/voice
      CORS_ORIGINS: http://localhost:5173
      API_HOST: "0.0.0.0"   # env_file (.env.example has 127.0.0.1) would otherwise override the image ENV
      API_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - ./logs:/app/logs

  ui:
    build: ./ui
    ports:
      - "5173:80"
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata: {}
